[package]
name = "super-pm"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "super_pm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
# An application crate: no documentation examples to test.
doctest = false

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
serde.workspace = true
serde_json.workspace = true
pm-core.workspace = true
pm-store.workspace = true
jiff = "0.2.36"
ts-rs = "12.0.1"
uuid = { version = "1.27", features = ["v7"] }
