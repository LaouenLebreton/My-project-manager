[package]
name = "super-pm"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "super_pm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
# An application crate: no documentation examples to test.
doctest = false

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
# 2.7.x: 2.8 was released days ago; see docs/decisions.md.
tauri-plugin-dialog = "~2.7.3"
tauri-plugin-notification = "~2.8.0"

serde.workspace = true
serde_json.workspace = true
pm-core.workspace = true
pm-store.workspace = true
pm-interop.workspace = true
pm-sync.workspace = true
pm-server.workspace = true
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json", "http2"] }
tokio = { version = "1.53.2", features = ["sync", "time", "macros", "net"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
jiff = "0.2.36"
ts-rs = "12.0.1"
uuid = { version = "1.27", features = ["v7", "v4"] }

# Native window tabs (platform.rs), macOS only. Same versions Tauri already uses. This table
# stays last: every line after a [target...] header belongs to it.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSResponder", "NSWindow", "NSWindowTabGroup"] }
objc2 = "0.6.5"
