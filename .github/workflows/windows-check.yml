# Builds and tests Super PM on Windows for every push to main, so problems show up before a
# release. Nothing is published.
name: Windows check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Build the .mpp converter
        shell: bash
        run: tools/mpp/build.sh
      - name: Web interface
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
      - name: Rust tests
        run: cargo test --workspace --lib
